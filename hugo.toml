baseURL = "https://odhyp.com/"
locale = "en-us"
title = "Odhy Pradhana"
enableGitInfo = true
enableRobotsTXT = true

# A hand-set lastmod beats Git
[frontmatter]
lastmod = ["lastmod", ":git", ":default"]

# RSS only from home (Writings only, see layouts/home.rss.xml); sitemap is always on
[outputs]
home = ["html", "rss"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]

# Per Hugo's Cloudflare guide; HUGO_CACHEDIR is set in build.sh
[caches.images]
dir = ":cacheDir/images"

# Topics is the only taxonomy; defining it drops Hugo's default tags and categories
[taxonomies]
topic = "topics"

[params]
description = ""

[params.author]
name = "Odhy Pradhana"

# url is the fallback until the pageRef page exists
[[menus.main]]
name = "Writings"
pageRef = "/writings"
url = "/writings/"
weight = 10

[[menus.main]]
name = "Projects"
pageRef = "/projects"
url = "/projects/"
weight = 20

[[menus.main]]
name = "Now"
pageRef = "/now"
url = "/now/"
weight = 30

[[menus.main]]
name = "About"
pageRef = "/about"
url = "/about/"
weight = 40
