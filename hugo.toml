baseURL = "https://odhyp.com/"
locale = "en-us"
title = "Odhy Pradhana"
enableGitInfo = true
enableRobotsTXT = true

# A hand-set lastmod beats Git
[frontmatter]
lastmod = ["lastmod", ":git", ":default"]

# RSS only from home (Writings only, see layouts/home.rss.xml); sitemap is always on
[outputs]
home = ["html", "rss"]
section = ["html"]
taxonomy = ["html"]
term = ["html"]

# Per Hugo's Cloudflare guide; HUGO_CACHEDIR is set in build.sh
[caches.images]
dir = ":cacheDir/images"

# Class-based Chroma; styles live in assets/css/chroma.css
[markup.highlight]
noClasses = false

# Topics is the only taxonomy; defining it drops Hugo's default tags and categories
[taxonomies]
topic = "topics"

[params]
description = ""

[params.author]
name = "Odhy Pradhana"
email = "hi@odhyp.com"

[[menus.main]]
name = "Writings"
pageRef = "/writings"
weight = 10

[[menus.main]]
name = "Now"
pageRef = "/now"
weight = 20

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 30
