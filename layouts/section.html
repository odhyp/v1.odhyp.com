{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <a href="{{ relref . "/topics" }}">Topics</a>
  <a href="{{ relref . "/search" }}">Search</a>
  {{ range .Pages.GroupByDate "2006" }}
    <section>
      <h2>{{ .Key }}</h2>
      <ul>
        {{ range .Pages }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ partial "date.html" .Date }}
            {{ partial "topics.html" . }}
          </li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
